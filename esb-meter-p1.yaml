# ESPHome config for reading an ESB Networks (Ireland) smart meter P1 port
# Tested: ESPHome 2026.10.2, ESP32-C3, single-phase ESB meter, November 2026
#
# Secrets expected in secrets.yaml:
#   wifi_ssid, wifi_password, api_key, ota_password

esphome:
  name: esb-meter-p1
  friendly_name: ESB Meter P1

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO          # DEBUG is useful while diagnosing, noisy otherwise

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESB-Meter-P1 Fallback"

captive_portal:

safe_mode:

time:
  - platform: homeassistant

status_led:
  pin: GPIO8           # remove if your board has no LED here (saves a little power)

# P1 is 115200 8N1. The signal is inverted (open collector).
# If your board has an inverting transistor/opto on RX, leave inverted off.
# If you wire RX directly to the port, set inverted: true.
uart:
  id: p1_uart
  rx_pin:
    number: GPIO20
    # inverted: true
  baud_rate: 115200
  rx_buffer_size: 1700

dsmr:
  uart_id: p1_uart
  max_telegram_length: 1700

sensor:
  - platform: dsmr
    # 1-0:1.8.0 / 2.8.0 — whole-meter active energy totals
    energy_delivered_lux:
      name: "Energy Imported Total"
      state_class: total_increasing
    energy_returned_lux:
      name: "Energy Exported Total"
      state_class: total_increasing

    # 1-0:1.8.1 .. 1.8.3 — import energy per tariff register
    # Which register is day / night / peak depends on your tariff: check against your bill.
    energy_delivered_tariff1:
      name: "Energy Imported Rate 1"
      state_class: total_increasing
    energy_delivered_tariff2:
      name: "Energy Imported Rate 2"
      state_class: total_increasing
    energy_delivered_tariff3:
      name: "Energy Imported Rate 3"
      state_class: total_increasing

    # 1-0:1.7.0 / 2.7.0 — total instantaneous active power (meter sends kW)
    power_delivered:
      name: "Power Import"
      unit_of_measurement: "W"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_returned:
      name: "Power Export"
      unit_of_measurement: "W"
      accuracy_decimals: 0
      filters:
        - multiply: 1000

    # 1-0:21.7.0 / 22.7.0 — L1 instantaneous active power (kW)
    power_delivered_l1:
      name: "Power Import L1"
      unit_of_measurement: "W"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_returned_l1:
      name: "Power Export L1"
      unit_of_measurement: "W"
      accuracy_decimals: 0
      filters:
        - multiply: 1000

    # 1-0:3.7.0 / 4.7.0 — instantaneous reactive power (kvar)
    reactive_power_delivered:
      name: "Reactive Power Import"
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    reactive_power_returned:
      name: "Reactive Power Export"
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000

    # 1-0:31.7.0 — L1 current (0.1 A resolution)
    current_l1:
      name: "Current L1"
      accuracy_decimals: 1

    # 1-0:32.32.0 / 32.36.0 — voltage sag / swell event counters, L1
    voltage_sag_l1:
      name: "Voltage Sags L1"
    voltage_swell_l1:
      name: "Voltage Swells L1"

    # 0-0:96.7.21 — number of short power failures
    electricity_failures:
      name: "Power Failures"
      icon: mdi:flash-off

  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

text_sensor:
  - platform: dsmr
    # Header line, e.g. /ESB5\XXXXXXXXX_F
    identification:
      name: "Meter ID"
    # 0-0:96.3.10 — breaker / disconnector state (1 = connected)
    electricity_switch_position:
      name: "Breaker State"

    # Uncomment to dump the raw telegram to the logs, one line per log entry.
    # Useful for checking whether ESB has added or changed OBIS codes.
    # Turn off afterwards: it adds load (~60 ms per telegram).
    # telegram:
    #   name: "P1 Telegram"
    #   internal: true
    #   on_value:
    #     then:
    #       - lambda: |-
    #           size_t s = 0;
    #           while (s < x.size()) {
    #             size_t e = x.find('\n', s);
    #             if (e == std::string::npos) e = x.size();
    #             ESP_LOGI("p1raw", "%s", x.substr(s, e - s).c_str());
    #             s = e + 1;
    #           }

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: "IP Address"

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Safe Mode Boot"
